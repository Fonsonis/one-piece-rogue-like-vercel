<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Ultimates · tamaños de pantalla</title><style>body{margin:0;background:#14232c;color:#eee;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center}select{padding:8px}iframe{display:block;margin:0 auto;border:0;background:white;max-width:100%}</style></head><body><header><label>Pantalla <select id="device"><option value="390,844">390 × 844</option><option value="320,568">320 × 568</option><option value="844,390">844 × 390</option></select></label><span>Revisión aislada: no cambia el tamaño del navegador compartido.</span></header><iframe title="Juego móvil" src="/review" width="390" height="844"></iframe><script>document.querySelector('select').onchange=e=>{const [w,h]=e.target.value.split(',');const frame=document.querySelector('iframe');frame.width=w;frame.height=h;};</script></body></html>
