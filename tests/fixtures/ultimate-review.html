<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estudio de ultimates · revisión local</title><script>window.addEventListener("error",e=>{document.documentElement.dataset.reviewError=(e.error?.stack||e.message);});</script>
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/art/theme.css"><link rel="stylesheet" href="/art/sprite-sizes.css"><link rel="stylesheet" href="/art/preferences.css"><link rel="stylesheet" href="/art/motion-bounds.css"><link rel="stylesheet" href="/art/responsive.css"><link rel="stylesheet" href="/art/crew-layout.css"><link rel="stylesheet" href="/art/compact-sprite-bounds.css"><link rel="stylesheet" href="/art/island-campaign.css"><link rel="stylesheet" href="/art/ultimates/ultimates.css">
<style>.review-controls{padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);position:relative;z-index:950;font:14px system-ui}.review-controls select{max-width:100%;padding:10px}.review-controls input{max-width:100%;}.review-stage{height:clamp(180px,40vh,340px);position:relative;margin:16px 0;background:radial-gradient(ellipse,#375767,#132331);overflow:hidden;border:2px solid #7da6ac;border-radius:4px;}.review-stage .dex-sprite{position:absolute;bottom:8px;--sprite-size:180px;}.review-stage .one{left:8%}.review-stage .two{right:8%;transform:scaleX(-1)}.review-stage canvas{position:absolute;inset:0;width:100%;height:100%;}.review-heading{position:absolute;top:8px;left:0;width:100%;font:700 14px system-ui;text-align:center;color:#fff4db;} .review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;}</style>
</head><body><div class="review-controls"><label>Personaje <select id="review-char"></select></label><button id="review-play" class="btn small">Reproducir</button><button id="review-sheet" class="btn small">Ficha real</button><button id="review-battle" class="btn small">Combate real</button><button id="review-fire" class="btn small">Ultimate real</button><button id="review-benchmark" class="btn small">Medir render</button><button id="review-gallery" class="btn small">Galería</button><label>Fotograma <input id="review-frame" type="range" min="0" max="100" value="58"></label><output id="review-info"></output></div><div id="app"></div>
<script src="/data.js"></script><script src="/save-storage.js"></script><script src="/game.js"></script><script src="/art/visuals.js"></script><script src="/art/ultimates/profiles.js"></script><script src="/art/ultimates/effects.js"></script><script src="/art/ultimates/integration.js"></script>
<script>
const select=document.querySelector('#review-char'),slider=document.querySelector('#review-frame');
select.innerHTML=Object.entries(CHARS).map(([id,c])=>`<option value="${id}">${c.name}</option>`).join('');select.value='law';
const spec=id=>UltimateArtProfiles.resolve(id,CHARS[id],getUltimateMove({id,lvl:100}),baseFormOf(id));
function stopReview(){UltimateFX.cancelAll();document.querySelectorAll('.overlay').forEach(x=>x.remove());if(battle){clearTimeout(battle.timer);battle.over=true;}autoMode=false;}
function stageHTML(id){return `<div class="review-stage" data-review-id="${id}"><div class="one dex-sprite" data-character="${id}" style="--sprite-atlas:url('/art/characters/${id}.png');--sprite-portrait:url('/art/portraits/${id}.png')"></div><div class="two dex-sprite" data-character="kaido" style="--sprite-atlas:url('/art/characters/kaido.png');--sprite-portrait:url('/art/portraits/kaido.png')"></div><canvas></canvas><div class="review-heading">${CHARS[id].name} · ${spec(id).technique}</div></div>`;}
function drawReview(){document.querySelectorAll('[data-review-id]').forEach(stage=>{const c=stage.querySelector('canvas'),r=stage.getBoundingClientRect();c.width=r.width;c.height=r.height;UltimateFX.drawFrame(c.getContext('2d'),spec(stage.dataset.reviewId),slider.value/100,{width:c.width,height:c.height});});}
function single(){stopReview();render(stageHTML(select.value));drawReview();document.querySelector('#review-info').textContent=spec(select.value).family+' · '+spec(select.value).motif;}
select.onchange=single;slider.oninput=drawReview;
document.querySelector('#review-play').onclick=()=>{single();const source=document.querySelector('.review-stage');UltimateFX.play({profile:spec(select.value),source,preview:true});source.querySelector('canvas').style.visibility='hidden';};
document.querySelector('#review-sheet').onclick=()=>{stopReview();showCharModal({id:select.value,...makeChar(select.value,100)});};
document.querySelector('#review-battle').onclick=()=>{stopReview();run={mode:'classic',saga:0,islandIdx:0,diff:1,team:[makeChar(select.value,100),makeChar('zoro',50)],items:{carne:3},berries:1000};startBattle([makeChar('kaido',100)],{wild:true});pauseBattle();};
document.querySelector('#review-fire').onclick=()=>{if(battle&&!battle.over){battle.curP.ultCharge=100;useUltimate(battle.curP);}};
document.querySelector('#review-gallery').onclick=()=>{stopReview();render('<div class="review-grid">'+['zoro2','law','kuma','aokiji','teach','marco','doflamingo','sanji','kaido','katakuri','robin','hancock'].map(stageHTML).join('')+'</div>');drawReview();};
document.querySelector('#review-benchmark').onclick=()=>{
 stopReview();render(stageHTML(select.value));const c=document.querySelector('canvas');c.width=585;c.height=240;const ctx=c.getContext('2d'),all=Object.keys(CHARS).map(spec),times=[];
 for(const p of all){const start=performance.now();for(const t of [.12,.3,.58,.84])UltimateFX.drawFrame(ctx,p,t,{width:c.width,height:c.height});times.push((performance.now()-start)/4);}
 times.sort((a,b)=>a-b);document.querySelector('#review-info').textContent=JSON.stringify({characters:all.length,frames:all.length*4,p95ms:+times[Math.floor(times.length*.95)].toFixed(2),worstMs:+times.at(-1).toFixed(2)});drawReview();
};
addEventListener('resize',drawReview);single();
</script></body></html>
