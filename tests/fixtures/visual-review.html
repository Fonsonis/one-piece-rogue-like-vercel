<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión Egghead · pruebas locales</title><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/runner/runner.css"><link rel="stylesheet" href="/art/theme.css"><link rel="stylesheet" href="/art/sprite-sizes.css"><link rel="stylesheet" href="/art/preferences.css"><link rel="stylesheet" href="/art/motion-bounds.css"><link rel="stylesheet" href="/art/responsive.css"><link rel="stylesheet" href="/art/market-reveal.css"></head><body><details class="qa-toolbar" style="position:fixed;left:0;top:0;z-index:5000;max-height:70dvh;overflow:auto;background:#fffcf3;color:#123;"><summary style="font:10px system-ui;cursor:pointer">Pruebas</summary><div style="display:grid;gap:4px"><button class="btn" id="qa-preferences">Datos de prueba · Nv30</button><button class="btn" id="qa-home">Menú</button><button class="btn" id="qa-sprites">Escalas</button><button class="btn" id="qa-buggy">Buggy contra Buggy</button><button class="btn" id="qa-map">Mapa y EXP</button><button class="btn" id="qa-long-map">Mapa largo</button><button class="btn" id="qa-battle-six">Combate 6 contra 6</button><button class="btn" id="qa-attack">Ataque congelado</button><button class="btn" id="qa-next">Siguiente luchador</button><button class="btn" id="qa-crew">Bandas</button><button class="btn" id="qa-island-shop">Tienda de isla</button><button class="btn" id="qa-recruit">Reclutar</button><button class="btn" id="qa-tower">Torre</button><button class="btn" id="qa-challenges">Desafíos</button><button class="btn" id="qa-rest">Descanso</button><button class="btn" id="qa-reward">Recompensa</button><button class="btn" id="qa-cartels">Carteles</button></div></details><div id="app"></div><script src="/data.js"></script><script src="/save-storage.js"></script><script src="/game.js"></script><script src="/art/visuals.js"></script><script src="/art/market-reveal.js"></script><script>

const qaStop=()=>{document.querySelectorAll('.overlay').forEach(e=>e.remove());if(battle){clearTimeout(battle.timer);battle.over=true;}autoMode=false;clearTimeout(autoTimer);};
document.querySelector('#qa-preferences').onclick=()=>{qaStop();run=null;meta.roster=['luffy','zoro','nami','buggy','chopper','sanji','newgate','kaido','bigmom','oars','kuma','naruto'];meta.dex=[...meta.roster];meta.recruited=[...meta.roster];meta.fame=2500;meta.accXp=xpForAccLevel(30);meta.sagaDiffWins=Object.fromEntries(SAGAS.map(s=>[s.id,{1:true,2:true,3:true}]));screenHome();};
document.querySelector('#qa-home').onclick=()=>{qaStop();screenHome();};
document.querySelector('#qa-sprites').onclick=()=>{
 qaStop();
 const ids=['luffy','zoro','buggy','nami','chopper','sanji','newgate','kaido','bigmom','oars','zunesha','kuma'];
 render(`<h2>Escala humana · pequeños · grandes · gigantes</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px">${ids.map((id,i)=>{const f=makeChar(id,20);f.xp=xpForLevel(20)/2;return fighterCardHTML(f,'p',i,f)}).join('')}</div>`);
};
document.querySelector('#qa-buggy').onclick=()=>{
 qaStop();run={mode:'classic',saga:0,islandIdx:0,diff:1,team:[makeChar('buggy',5)],items:{},berries:0};
 run.team[0].moves=['cuchillas','cortedoble'];
 const e=makeChar('buggy',5);e.moves=['cuchillas','cortedoble'];
 startBattle([e],{wild:true});
 endBattle=()=>{render(`<div class="panel"><h2>Combate terminado</h2><p>Buggy contra Buggy con ataques antiguos. Rondas: ${battle.round}.</p><p>EXP: ${run.team[0].xp}</p>${xpBarHTML(run.team[0])}</div>`);};
 gameOver=()=>render('<div class="panel"><h2>Combate terminado: derrota</h2></div>');
};
document.querySelector('#qa-map').onclick=()=>{
 qaStop();run={mode:'classic',saga:0,islandIdx:0,diff:1,team:[makeChar('luffy',5),makeChar('zoro',5)],items:{},berries:300,map:genMap(SAGAS[0].islands[0]),pos:null,badges:[],nuzCaught:{},sagaRerollUsed:false};
 run.team[0].xp=75;screenMap();
};

const qaRun=()=>{
 qaStop();document.querySelectorAll('.overlay').forEach(e=>e.remove());
 run={mode:'classic',saga:9,islandIdx:6,diff:1,team:['kuma','zoro','luffy','chopper','oars','bigmom'].map(id=>makeChar(id,35)),items:{carne:3,carnereal:3,bocadillo:3,sake:3,cartel:5},berries:9999,map:genMap(SAGAS[9].islands[6]),pos:null,badges:[],nuzCaught:{},sagaRerollUsed:false};
};
document.querySelector('#qa-long-map').onclick=()=>{qaRun();screenMap();};
document.querySelector('#qa-battle-six').onclick=()=>{qaRun();battle=null;startBattle(['oars','kaido','newgate','buggy','zunesha','nami'].map(id=>makeChar(id,35)),{wild:true});pauseBattle();};
document.querySelector('#qa-attack').onclick=()=>{if(!battle)return;battle.waiting=true;attackWith(battle.curP,battle.curE,MOVES.punetazo);document.querySelectorAll('.dex-sprite').forEach(e=>e.getAnimations().forEach(a=>{a.pause();a.currentTime=Number(a.effect.getTiming().duration)*.28;}));};
document.querySelector('#qa-next').onclick=()=>{if(!battle)return;battle.curP.hp=0;battle.curE.hp=0;battle.curP=battle.pTeam.find(f=>f.hp>0);battle.curE=battle.eTeam.find(f=>f.hp>0);if(battle.curP&&battle.curE)refreshHPCards();};
document.querySelector('#qa-crew').onclick=()=>showBattleCrew();
document.querySelector('#qa-island-shop').onclick=()=>{qaRun();screenShop();};
document.querySelector('#qa-recruit').onclick=()=>{qaRun();specialJoin('kaido',35);};
document.querySelector('#qa-tower').onclick=()=>{qaStop();screenTowerIntro();};
document.querySelector('#qa-challenges').onclick=()=>{qaStop();meta.accXp=xpForAccLevel(80);screenChallenges();};
document.querySelector('#qa-rest').onclick=()=>{qaRun();const r=run.map.rows.findIndex(row=>row.some(n=>n.type==='rest'));showNodeConfirmModal(r,run.map.rows[r].findIndex(n=>n.type==='rest'));};
document.querySelector('#qa-reward').onclick=()=>{qaRun();showRelicRewardModal(Object.keys(RELICS).slice(0,3));};
document.querySelector('#qa-cartels').onclick=()=>{qaRun();renderSpecialGacha(35);};
document.querySelectorAll('.qa-toolbar button').forEach(button=>button.addEventListener('click',()=>document.querySelector('.qa-toolbar').open=false));
</script></body></html>
