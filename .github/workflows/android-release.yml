name: Publicar APK Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # El paquete SDK heredado `tools` ya no existe. El action lo solicita
          # por defecto si no se indica explícitamente esta lista.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: node scripts/verify-android-version.mjs
      - name: Preparar versión incremental Android
        shell: bash
        run: |
          app_version_name=$(node -p "require('./package.json').version")
          app_version_code=$(date +%s)
          node -e "const fs=require('fs');const p='public/android-version.json';const x=JSON.parse(fs.readFileSync(p));x.version=process.argv[1];x.versionCode=Number(process.argv[2]);fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n')" "$app_version_name" "$app_version_code"
          echo "APP_VERSION_NAME=$app_version_name" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$app_version_code" >> "$GITHUB_ENV"
      - run: npm run android:sync
      - name: Restaurar clave de firma
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Falta configurar el secret ${secret_name} en GitHub Actions."
              missing=1
            fi
          done
          test "$missing" -eq 0
          mkdir -p .android-signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .android-signing/one-piece-rogue-like.jks
          {
            echo 'storeFile=.android-signing/one-piece-rogue-like.jks'
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > .android-signing/signing.properties
      - name: Compilar APK release
        if: github.event_name != 'pull_request'
        working-directory: android
        run: ./gradlew assembleRelease -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME"
      - name: Verificar APK de la PR
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew assembleDebug -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME"
      - name: Preparar artefacto
        if: github.event_name != 'pull_request'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk one-piece-rogue-like.apk
          sha256sum one-piece-rogue-like.apk > one-piece-rogue-like.apk.sha256
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: android-${{ env.APP_VERSION_CODE }}
          name: Android ${{ env.APP_VERSION_NAME }} · compilación ${{ env.APP_VERSION_CODE }}
          make_latest: true
          files: |
            one-piece-rogue-like.apk
            one-piece-rogue-like.apk.sha256
            public/android-version.json
          generate_release_notes: true
