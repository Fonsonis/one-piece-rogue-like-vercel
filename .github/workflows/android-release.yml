name: Publicar Android y Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: platform-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app_version_name: ${{ steps.release.outputs.app_version_name }}
      app_version_code: ${{ steps.release.outputs.app_version_code }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Preparar versión compartida
        shell: bash
        run: |
          app_version_name=$(node -p "require('./package.json').version")
          app_version_code=$(date +%s)
          echo "app_version_name=$app_version_name" >> "$GITHUB_OUTPUT"
          echo "app_version_code=$app_version_code" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: ${{ needs.version.outputs.app_version_name }}
      APP_VERSION_CODE: ${{ needs.version.outputs.app_version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: node scripts/verify-android-version.mjs
      - name: Preparar configuración de release
        run: node scripts/prepare-platform-release.mjs
      - run: npm run android:sync
      - name: Verificar puente de actualización Android
        working-directory: android
        run: bash ./gradlew testDebugUnitTest
      - name: Restaurar clave de firma
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Falta configurar el secret ${secret_name} en GitHub Actions."
              missing=1
            fi
          done
          test "$missing" -eq 0
          mkdir -p .android-signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .android-signing/mareas-del-umbral.jks
          {
            echo 'storeFile=.android-signing/mareas-del-umbral.jks'
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > .android-signing/signing.properties
      - name: Compilar APK release
        if: github.event_name != 'pull_request'
        working-directory: android
        run: bash ./gradlew assembleRelease -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME"
      - name: Verificar que la APK coincide con la release
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          badging="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging android/app/build/outputs/apk/release/app-release.apk | sed -n '1p')"
          echo "$badging"
          [[ "$badging" == *"name='com.umbral.mareas'"* ]]
          [[ "$badging" == *"versionCode='$APP_VERSION_CODE'"* ]]
          [[ "$badging" == *"versionName='$APP_VERSION_NAME'"* ]]
          node -e "const m=require('./public/android-version.json');if(m.versionCode!==Number(process.env.APP_VERSION_CODE)||m.version!==process.env.APP_VERSION_NAME||!m.downloadUrl.endsWith('/android-'+process.env.APP_VERSION_CODE+'/mareas-del-umbral.apk'))process.exit(1)"
      - name: Verificar APK de la PR
        if: github.event_name == 'pull_request'
        working-directory: android
        run: bash ./gradlew assembleDebug -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME"
      - name: Preparar artefactos Android
        if: github.event_name != 'pull_request'
        run: |
          mkdir release
          cp android/app/build/outputs/apk/release/app-release.apk release/mareas-del-umbral.apk
          sha256sum release/mareas-del-umbral.apk > release/mareas-del-umbral.apk.sha256
          cp public/android-version.json release/android-version.json
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: android-release
          path: release/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      APP_VERSION_NAME: ${{ needs.version.outputs.app_version_name }}
      APP_VERSION_CODE: ${{ needs.version.outputs.app_version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preparar configuración de release
        run: node scripts/prepare-platform-release.mjs
      - run: npm run desktop:exe
      - name: Preparar artefactos Windows
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          Copy-Item outputs/windows/mareas-del-umbral-setup.exe release/mareas-del-umbral-setup.exe
          Copy-Item public/windows-version.json release/windows-version.json
          $hash = (Get-FileHash release/mareas-del-umbral-setup.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content release/mareas-del-umbral-setup.exe.sha256 "$hash  mareas-del-umbral-setup.exe"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: windows-release
          path: release/*
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs:
      - version
      - android
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ needs.version.outputs.app_version_code }}
          name: Mareas del Umbral ${{ needs.version.outputs.app_version_name }} · compilación ${{ needs.version.outputs.app_version_code }}
          make_latest: true
          files: release/*
          generate_release_notes: true
